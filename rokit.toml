# Toolchain pinned for this project. Install with `rokit install`.
# If GitHub release downloads are blocked, scripts/bootstrap.sh builds the
# same versions from crates.io (all except luau-lsp, which CI runs).
[tools]
rojo = "rojo-rbx/rojo@7.7.1"
lune = "lune-org/lune@0.11.1"
stylua = "JohnnyMorganz/StyLua@2.6.0"
selene = "Kampfkarren/selene@0.31.0"
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"
